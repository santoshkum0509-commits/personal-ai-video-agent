name: Free Video Renderer

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Read Scene 1
        run: |
          jq -r '.onScreenText' scene1.json > scene_text.txt
          jq -r '.duration' scene1.json > duration.txt

          echo "Scene text:"
          cat scene_text.txt

          echo "Duration:"
          cat duration.txt

      - name: Create SVG Text
        run: |
          python3 - <<'PY'
          import html
          import json

          with open("scene1.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          text = data["onScreenText"]

          words = text.split()
          lines = []
          current = ""

          for word in words:
              test = (current + " " + word).strip()

              if len(test) > 30:
                  if current:
                      lines.append(current)
                  current = word
              else:
                  current = test

          if current:
              lines.append(current)

          print("Final lines:")
          for line in lines:
              print(line)

          start_y = 850
          line_gap = 85

          text_elements = []

          for i, line in enumerate(lines):
              y = start_y + (i * line_gap)

              text_elements.append(
                  f'<text x="540" y="{y}" '
                  f'text-anchor="middle" '
                  f'font-family="DejaVu Sans, Arial, sans-serif" '
                  f'font-size="52" '
                  f'font-weight="700" '
                  f'fill="white">{html.escape(line)}</text>'
              )

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="1080"
          height="1920"
          viewBox="0 0 1080 1920">

          <rect width="1080" height="1920" fill="black"/>

          {''.join(text_elements)}

          </svg>'''

          with open("scene1.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          print("SVG created successfully.")
          PY

          echo "----- SVG -----"
          cat scene1.svg

      - name: Convert SVG to PNG
        run: |
          ffmpeg \
            -y \
            -i scene1.svg \
            -frames:v 1 \
            scene1.png

      - name: Create Scene 1 Video
        run: |
          DURATION=$(cat duration.txt)

          ffmpeg \
            -y \
            -loop 1 \
            -i scene1.png \
            -t "$DURATION" \
            -r 30 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -vf "scale=1080:1920" \
            output_scene1.mp4

      - name: Check Video
        run: |
          ls -lh output_scene1.mp4

          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output_scene1.mp4

      - name: Upload Scene 1
        uses: actions/upload-artifact@v4
        with:
          name: scene1
          path: output_scene1.mp4
