name: Free Video Renderer

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Install required tools
      # --------------------------------------------------
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip wget


      # --------------------------------------------------
      # 3. Install Piper TTS
      # --------------------------------------------------
      - name: Install Piper TTS
        run: |
          python3 -m pip install --upgrade pip
          pip install piper-tts


      # --------------------------------------------------
      # 4. Download Hindi voice model
      # --------------------------------------------------
      - name: Download Hindi Voice Model
        run: |
          mkdir -p models

          wget -q \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx \
            -O models/hi_IN-pratham-medium.onnx

          wget -q \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx.json \
            -O models/hi_IN-pratham-medium.onnx.json

          echo "Voice model downloaded."

          ls -lh models/


      # --------------------------------------------------
      # 5. Read Scene 1
      # --------------------------------------------------
      - name: Read Scene 1
        run: |
          python3 - <<'PY'
          import json

          with open("scene1.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          text = data.get("onScreenText", "")

          print("Original Scene Text:")
          print(text)

          # Save original text
          with open("original_text.txt", "w", encoding="utf-8") as f:
              f.write(text)

          # Hindi-friendly TTS pronunciation
          tts_text = text

          replacements = {
              "AI tool": "ए आई टूल",
              "AI": "ए आई",
              "minutes": "मिनट्स",
              "try": "ट्राय",
              "tool": "टूल"
          }

          for old, new in replacements.items():
              tts_text = tts_text.replace(old, new)

          with open("tts_text.txt", "w", encoding="utf-8") as f:
              f.write(tts_text)

          print("")
          print("TTS Text:")
          print(tts_text)
          PY


      # --------------------------------------------------
      # 6. Generate Natural Hindi Voice
      # --------------------------------------------------
      - name: Generate Hindi Voiceover
        run: |
          mkdir -p audio

          cat tts_text.txt | \
            piper \
              --model models/hi_IN-pratham-medium.onnx \
              --output_file audio/voice.wav

          echo "Voice generated successfully."

          ls -lh audio/voice.wav


      # --------------------------------------------------
      # 7. Detect Voice Duration
      # --------------------------------------------------
      - name: Detect Voice Duration
        run: |
          VOICE_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            audio/voice.wav)

          echo "Voice duration: $VOICE_DURATION seconds"

          echo "$VOICE_DURATION" > voice_duration.txt


      # --------------------------------------------------
      # 8. Create Professional SVG Visual
      # --------------------------------------------------
      - name: Create Scene Visual
        run: |
          python3 - <<'PY'
          import html
          import json

          with open("scene1.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          text = data.get("onScreenText", "")

          # Split text into readable lines
          words = text.split()

          lines = []
          current = ""

          for word in words:
              test = (current + " " + word).strip()

              if len(test) > 30:
                  if current:
                      lines.append(current)
                  current = word
              else:
                  current = test

          if current:
              lines.append(current)

          text_elements = []

          start_y = 850
          line_gap = 82

          for i, line in enumerate(lines):

              y = start_y + (i * line_gap)

              text_elements.append(
                  f"""
                  <text
                    x="540"
                    y="{y}"
                    text-anchor="middle"
                    font-family="DejaVu Sans, Arial, sans-serif"
                    font-size="50"
                    font-weight="700"
                    fill="white"
                    stroke="#000000"
                    stroke-width="3"
                    paint-order="stroke">

                    {html.escape(line)}

                  </text>
                  """
              )

          svg = f"""
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="1080"
            height="1920"
            viewBox="0 0 1080 1920">

            <defs>

              <linearGradient
                id="bg"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                  offset="0%"
                  stop-color="#050B18"/>

                <stop
                  offset="50%"
                  stop-color="#102D4F"/>

                <stop
                  offset="100%"
                  stop-color="#020409"/>

              </linearGradient>

              <radialGradient id="glowBlue">

                <stop
                  offset="0%"
                  stop-color="#168CFF"
                  stop-opacity="0.55"/>

                <stop
                  offset="100%"
                  stop-color="#168CFF"
                  stop-opacity="0"/>

              </radialGradient>

              <radialGradient id="glowPurple">

                <stop
                  offset="0%"
                  stop-color="#7B4DFF"
                  stop-opacity="0.40"/>

                <stop
                  offset="100%"
                  stop-color="#7B4DFF"
                  stop-opacity="0"/>

              </radialGradient>

            </defs>


            <!-- Background -->
            <rect
              width="1080"
              height="1920"
              fill="url(#bg)"/>


            <!-- Blue glow -->
            <circle
              cx="150"
              cy="350"
              r="550"
              fill="url(#glowBlue)"/>


            <!-- Purple glow -->
            <circle
              cx="950"
              cy="1500"
              r="650"
              fill="url(#glowPurple)"/>


            <!-- Grid -->
            <g
              opacity="0.10"
              stroke="white"
              stroke-width="2">

              <path d="M0 200 H1080"/>
              <path d="M0 400 H1080"/>
              <path d="M0 600 H1080"/>
              <path d="M0 800 H1080"/>
              <path d="M0 1000 H1080"/>
              <path d="M0 1200 H1080"/>
              <path d="M0 1400 H1080"/>
              <path d="M0 1600 H1080"/>
              <path d="M0 1800 H1080"/>

              <path d="M180 0 V1920"/>
              <path d="M360 0 V1920"/>
              <path d="M540 0 V1920"/>
              <path d="M720 0 V1920"/>
              <path d="M900 0 V1920"/>

            </g>


            <!-- AI Circle -->
            <circle
              cx="540"
              cy="500"
              r="135"
              fill="#07111F"
              stroke="#4DA3FF"
              stroke-width="6"/>


            <circle
              cx="540"
              cy="500"
              r="105"
              fill="none"
              stroke="#8BC7FF"
              stroke-width="2"
              opacity="0.7"/>


            <!-- AI Text -->
            <text
              x="540"
              y="515"
              text-anchor="middle"
              font-family="DejaVu Sans, Arial, sans-serif"
              font-size="58"
              font-weight="800"
              fill="white">

              AI

            </text>


            <!-- Label -->
            <text
              x="540"
              y="675"
              text-anchor="middle"
              font-family="DejaVu Sans, Arial, sans-serif"
              font-size="30"
              font-weight="700"
              letter-spacing="3"
              fill="#9CCAFF">

              FREE AI TOOL

            </text>


            <!-- Hook Text -->
            {''.join(text_elements)}

          </svg>
          """

          with open("scene1.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          print("Scene SVG created.")
          PY


      # --------------------------------------------------
      # 9. Convert SVG to PNG
      # --------------------------------------------------
      - name: Render Scene Image
        run: |
          ffmpeg \
            -y \
            -i scene1.svg \
            -frames:v 1 \
            scene1.png


      # --------------------------------------------------
      # 10. Create Video
      # --------------------------------------------------
      - name: Create Video With Voice
        run: |
          mkdir -p output

          VOICE_DURATION=$(cat voice_duration.txt)

          echo "Creating video..."
          echo "Duration: $VOICE_DURATION seconds"

          ffmpeg \
            -y \
            -loop 1 \
            -i scene1.png \
            -i audio/voice.wav \
            -t "$VOICE_DURATION" \
            -r 30 \
            -vf "scale=1080:1920,zoompan=z='min(zoom+0.0007,1.04)':d=120:s=1080x1920:fps=30,format=yuv420p" \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -shortest \
            output/scene1-piper.mp4


      # --------------------------------------------------
      # 11. Verify Video
      # --------------------------------------------------
      - name: Verify Output
        run: |
          echo "Final video:"

          ls -lh output/scene1-piper.mp4

          echo ""
          echo "Video information:"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output/scene1-piper.mp4


      # --------------------------------------------------
      # 12. Upload Everything
      # --------------------------------------------------
      - name: Upload Scene 1 Files
        uses: actions/upload-artifact@v4
        with:
          name: scene1-piper-test
          path: |
            output/scene1-piper.mp4
            audio/voice.wav
            tts_text.txt
            voice_duration.txt
