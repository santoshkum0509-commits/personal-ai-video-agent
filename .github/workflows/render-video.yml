name: Free Video Renderer

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and Hindi font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Check FFmpeg
        run: |
          ffmpeg -version

      - name: Check Hindi font
        run: |
          fc-list | grep -i "Noto Sans Devanagari" | head

      - name: Create output folder
        run: |
          mkdir -p output

      - name: Create Scene 1
        run: |
          ffmpeg \
            -f lavfi \
            -i "color=c=black:s=1080x1920:r=30" \
            -t 4 \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/noto/NotoSansDevanagari-Regular.ttf:text='अगर आपको एक ऐसा AI tool मिल जाए':fontcolor=white:fontsize=58:x=(w-text_w)/2:y=(h-text_h)/2:line_spacing=12" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            output/scene1.mp4

      - name: Verify video
        run: |
          ls -lh output/
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            output/scene1.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: actual-scene-test
          path: output/scene1.mp4
