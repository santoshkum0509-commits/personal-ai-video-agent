name: Free Video Renderer

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Read Scene 1 JSON
        run: |
          echo "Reading scene1.json..."

          TEXT=$(jq -r '.onScreenText' scene1.json)
          DURATION=$(jq -r '.duration' scene1.json)

          echo "Text: $TEXT"
          echo "Duration: $DURATION"

          echo "TEXT=$TEXT" >> "$GITHUB_ENV"
          echo "DURATION=$DURATION" >> "$GITHUB_ENV"

      - name: Create Scene 1 Video
        run: |
          mkdir -p output

          ffmpeg \
            -f lavfi \
            -i color=c=black:s=1080x1920:r=30 \
            -t "$DURATION" \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='$TEXT':fontcolor=white:fontsize=52:x=(w-text_w)/2:y=(h-text_h)/2:enable='between(t,0,$DURATION)',format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            "output/scene1.mp4"

      - name: Check Output
        run: |
          ls -lh output/scene1.mp4

          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output/scene1.mp4

      - name: Upload Scene 1
        uses: actions/upload-artifact@v4
        with:
          name: scene1
          path: output/scene1.mp4
