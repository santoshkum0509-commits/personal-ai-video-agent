name: Free Video Renderer

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Read Scene 1
        run: |
          jq -r '.onScreenText' scene1.json > scene_text.txt
          jq -r '.duration' scene1.json > duration.txt

          echo "Scene text:"
          cat scene_text.txt

          echo "Duration:"
          cat duration.txt

      - name: Create SVG Scene
        run: |
          python3 - <<'PY'
          import html
          import json

          with open("scene1.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          text = data["onScreenText"]

          words = text.split()
          lines = []
          current = ""

          for word in words:
              test = (current + " " + word).strip()

              if len(test) > 30:
                  if current:
                      lines.append(current)
                  current = word
              else:
                  current = test

          if current:
              lines.append(current)

          start_y = 820
          line_gap = 90

          text_elements = []

          for i, line in enumerate(lines):
              y = start_y + i * line_gap

              text_elements.append(
                  f'''
                  <text
                    x="540"
                    y="{y}"
                    text-anchor="middle"
                    font-family="DejaVu Sans, Arial, sans-serif"
                    font-size="52"
                    font-weight="700"
                    fill="white"
                    stroke="black"
                    stroke-width="3"
                    paint-order="stroke">
                    {html.escape(line)}
                  </text>
                  '''
              )

          svg = f'''
          <svg xmlns="http://www.w3.org/2000/svg"
               width="1080"
               height="1920"
               viewBox="0 0 1080 1920">

            <defs>
              <linearGradient id="bg"
                              x1="0"
                              y1="0"
                              x2="1"
                              y2="1">
                <stop offset="0%" stop-color="#07111f"/>
                <stop offset="50%" stop-color="#102a43"/>
                <stop offset="100%" stop-color="#03070d"/>
              </linearGradient>

              <radialGradient id="glow">
                <stop offset="0%" stop-color="#2f80ed"
                      stop-opacity="0.45"/>
                <stop offset="100%" stop-color="#2f80ed"
                      stop-opacity="0"/>
              </radialGradient>
            </defs>

            <rect width="1080" height="1920"
                  fill="url(#bg)"/>

            <circle cx="180" cy="350"
                    r="450"
                    fill="url(#glow)"/>

            <circle cx="900" cy="1500"
                    r="550"
                    fill="url(#glow)"/>

            <g opacity="0.12"
               stroke="white"
               stroke-width="2">

              <path d="M0 300 H1080"/>
              <path d="M0 600 H1080"/>
              <path d="M0 900 H1080"/>
              <path d="M0 1200 H1080"/>
              <path d="M0 1500 H1080"/>

              <path d="M180 0 V1920"/>
              <path d="M360 0 V1920"/>
              <path d="M540 0 V1920"/>
              <path d="M720 0 V1920"/>
              <path d="M900 0 V1920"/>
            </g>

            <text x="540"
                  y="620"
                  text-anchor="middle"
                  font-family="DejaVu Sans, Arial, sans-serif"
                  font-size="34"
                  font-weight="700"
                  fill="#9ccaff">
              AI TOOL
            </text>

            {''.join(text_elements)}

          </svg>
          '''

          with open("scene1.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          print("SVG scene created.")
          PY

      - name: Convert Scene to PNG
        run: |
          ffmpeg \
            -y \
            -i scene1.svg \
            -frames:v 1 \
            scene1.png

      - name: Create Scene 1 Video
        run: |
          mkdir -p output

          DURATION=$(cat duration.txt)

          ffmpeg \
            -y \
            -loop 1 \
            -i scene1.png \
            -t "$DURATION" \
            -r 30 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -vf "scale=1080:1920" \
            output/scene1.mp4

      - name: Check Video
        run: |
          ls -lh output/scene1.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output/scene1.mp4

      - name: Upload Scene 1
        uses: actions/upload-artifact@v4
        with:
          name: scene1
          path: output/scene1.mp4
