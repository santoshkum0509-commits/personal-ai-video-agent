name: Free Video Renderer

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Read Scene 1
        run: |
          jq -r '.onScreenText' scene1.json > scene_text.txt
          jq -r '.duration' scene1.json > duration.txt

          echo "Scene text:"
          cat scene_text.txt

          echo "Duration:"
          cat duration.txt

      - name: Create Animated Scene SVG
        run: |
          python3 - <<'PY'
          import html
          import json

          with open("scene1.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          text = data["onScreenText"]

          words = text.split()
          lines = []
          current = ""

          for word in words:
              test = (current + " " + word).strip()

              if len(test) > 30:
                  if current:
                      lines.append(current)
                  current = word
              else:
                  current = test

          if current:
              lines.append(current)

          text_elements = []

          start_y = 800
          line_gap = 88

          for i, line in enumerate(lines):
              y = start_y + (i * line_gap)

              text_elements.append(
                  f'''
                  <text
                    x="540"
                    y="{y}"
                    text-anchor="middle"
                    font-family="DejaVu Sans, Arial, sans-serif"
                    font-size="52"
                    font-weight="700"
                    fill="white"
                    stroke="black"
                    stroke-width="3"
                    paint-order="stroke">
                    {html.escape(line)}
                  </text>
                  '''
              )

          svg = f'''
          <svg xmlns="http://www.w3.org/2000/svg"
               width="1080"
               height="1920"
               viewBox="0 0 1080 1920">

            <defs>

              <linearGradient id="background"
                              x1="0"
                              y1="0"
                              x2="1"
                              y2="1">

                <stop offset="0%"
                      stop-color="#07111f"/>

                <stop offset="50%"
                      stop-color="#123456"/>

                <stop offset="100%"
                      stop-color="#02050a"/>

              </linearGradient>

              <radialGradient id="glow1">

                <stop offset="0%"
                      stop-color="#4da3ff"
                      stop-opacity="0.55"/>

                <stop offset="100%"
                      stop-color="#4da3ff"
                      stop-opacity="0"/>

              </radialGradient>

              <radialGradient id="glow2">

                <stop offset="0%"
                      stop-color="#7b61ff"
                      stop-opacity="0.45"/>

                <stop offset="100%"
                      stop-color="#7b61ff"
                      stop-opacity="0"/>

              </radialGradient>

            </defs>

            <rect width="1080"
                  height="1920"
                  fill="url(#background)"/>

            <circle cx="150"
                    cy="350"
                    r="500"
                    fill="url(#glow1)"/>

            <circle cx="930"
                    cy="1500"
                    r="600"
                    fill="url(#glow2)"/>

            <g opacity="0.10"
               stroke="white"
               stroke-width="2">

              <path d="M0 250 H1080"/>
              <path d="M0 500 H1080"/>
              <path d="M0 750 H1080"/>
              <path d="M0 1000 H1080"/>
              <path d="M0 1250 H1080"/>
              <path d="M0 1500 H1080"/>
              <path d="M0 1750 H1080"/>

              <path d="M180 0 V1920"/>
              <path d="M360 0 V1920"/>
              <path d="M540 0 V1920"/>
              <path d="M720 0 V1920"/>
              <path d="M900 0 V1920"/>

            </g>

            <circle cx="540"
                    cy="500"
                    r="120"
                    fill="none"
                    stroke="#5db4ff"
                    stroke-width="5"
                    opacity="0.65"/>

            <circle cx="540"
                    cy="500"
                    r="75"
                    fill="none"
                    stroke="#ffffff"
                    stroke-width="3"
                    opacity="0.8"/>

            <text x="540"
                  y="510"
                  text-anchor="middle"
                  font-family="DejaVu Sans, Arial, sans-serif"
                  font-size="42"
                  font-weight="700"
                  fill="white">
              AI
            </text>

            <text x="540"
                  y="650"
                  text-anchor="middle"
                  font-family="DejaVu Sans, Arial, sans-serif"
                  font-size="30"
                  font-weight="700"
                  fill="#9ccaff">
              FREE AI TOOL
            </text>

            {''.join(text_elements)}

          </svg>
          '''

          with open("scene1.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          print("Animated-style SVG created successfully.")
          PY

      - name: Render SVG to PNG
        run: |
          ffmpeg \
            -y \
            -i scene1.svg \
            -frames:v 1 \
            scene1.png

      - name: Create Animated Video
        run: |
          mkdir -p output

          DURATION=$(cat duration.txt)

          ffmpeg \
            -y \
            -loop 1 \
            -i scene1.png \
            -t "$DURATION" \
            -r 30 \
            -vf "scale=1080:1920,zoompan=z='min(zoom+0.0008,1.035)':d=120:s=1080x1920:fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            output/scene1.mp4

      - name: Check Output
        run: |
          ls -lh output/scene1.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output/scene1.mp4

      - name: Upload Scene 1
        uses: actions/upload-artifact@v4
        with:
          name: scene1-animated
          path: output/scene1.mp4
