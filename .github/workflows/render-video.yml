name: Free Video Renderer

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git python3-pip

      - name: Upgrade Python packaging
        run: |
          python3 -m pip install --upgrade pip setuptools wheel

      - name: Install Hindi TTS dependencies
        run: |
          pip install \
            torch \
            torchaudio \
            soundfile \
            numpy \
            scipy \
            librosa \
            einops \
            jieba \
            pypinyin \
            omegaconf \
            transformers \
            safetensors \
            accelerate \
            ema-pytorch \
            torchdiffeq \
            vocos \
            f5-tts \
            huggingface_hub

      - name: Download Hindi TTS inference code
        run: |
          git clone --depth 1 \
            https://huggingface.co/spaces/5ivatej/hindi-tts-190M \
            tts-space

      - name: Read Scene 1
        run: |
          python3 - <<'PY'
          import json

          with open("scene1.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          text = data.get("onScreenText", "")

          print("Original Scene Text:")
          print(text)

          with open("original_text.txt", "w", encoding="utf-8") as f:
              f.write(text)

          tts_text = text

          replacements = {
              "AI tool": "ए आई टूल",
              "AI": "ए आई",
              "minutes": "मिनट्स",
              "try": "ट्राय",
              "tool": "टूल"
          }

          for old, new in replacements.items():
              tts_text = tts_text.replace(old, new)

          with open("tts_text.txt", "w", encoding="utf-8") as f:
              f.write(tts_text)

          print("")
          print("TTS Text:")
          print(tts_text)
          PY

      - name: Generate Hindi Voiceover
        working-directory: tts-space
        run: |
          mkdir -p ../audio

          python3 - <<'PY'
          import soundfile as sf
          from infer_core import HindiTTS

          with open("../tts_text.txt", "r", encoding="utf-8") as f:
              text = f.read().strip()

          print("Loading Hindi TTS 190M on CPU...")

          tts = HindiTTS(device="cpu")

          print("Generating voice...")
          print("Text:", text)

          sr, wave = tts.synth(
              text,
              nfe_step=32,
              seed=0
          )

          sf.write(
              "../audio/voice-original.wav",
              wave,
              sr
          )

          print("Voice generated successfully.")
          print("Sample rate:", sr)
          print("Samples:", len(wave))
          PY

      - name: Enhance Voice
        run: |
          ffmpeg -y \
            -i audio/voice-original.wav \
            -af "highpass=f=70,equalizer=f=250:t=q:w=1:g=-1.5,equalizer=f=3000:t=q:w=1:g=1.5,acompressor=threshold=-18dB:ratio=2:attack=15:release=120:makeup=1.2,loudnorm=I=-16:TP=-1.5:LRA=7" \
            -ar 24000 \
            audio/voice.wav

          echo "Enhanced voice created."

          ls -lh audio/voice-original.wav
          ls -lh audio/voice.wav

      - name: Detect Voice Duration
        run: |
          VOICE_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            audio/voice.wav)

          echo "Voice duration: $VOICE_DURATION seconds"

          echo "$VOICE_DURATION" > voice_duration.txt

      - name: Create Free Background Music
        run: |
          mkdir -p audio

          echo "Creating free generated background music..."

          ffmpeg -y \
            -f lavfi -i "sine=frequency=196:sample_rate=24000" \
            -f lavfi -i "sine=frequency=246.94:sample_rate=24000" \
            -f lavfi -i "sine=frequency=293.66:sample_rate=24000" \
            -filter_complex "
              [0:a]volume=0.045,lowpass=f=900[a0];
              [1:a]volume=0.032,lowpass=f=1200[a1];
              [2:a]volume=0.022,lowpass=f=1500[a2];
              [a0][a1][a2]amix=inputs=3:duration=longest,
              tremolo=f=0.18:d=0.35,
              aecho=0.8:0.7:600:0.18,
              afade=t=in:st=0:d=1,
              loudnorm=I=-24:TP=-2:LRA=7
            " \
            -t 60 \
            -ar 24000 \
            -ac 1 \
            audio/background-music.wav

          echo "Background music created."

          ls -lh audio/background-music.wav

      - name: Create Professional SVG Visual
        run: |
          python3 - <<'PY'
          import html
          import json

          with open("scene1.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          text = data.get("onScreenText", "")

          words = text.split()

          lines = []
          current = ""

          for word in words:
              test = (current + " " + word).strip()

              if len(test) > 30:
                  if current:
                      lines.append(current)
                  current = word
              else:
                  current = test

          if current:
              lines.append(current)

          text_elements = []

          start_y = 850
          line_gap = 82

          for i, line in enumerate(lines):
              y = start_y + (i * line_gap)

              text_elements.append(
                  f"""
                  <text
                    x="540"
                    y="{y}"
                    text-anchor="middle"
                    font-family="DejaVu Sans, Arial, sans-serif"
                    font-size="50"
                    font-weight="700"
                    fill="white"
                    stroke="#000000"
                    stroke-width="3"
                    paint-order="stroke">
                    {html.escape(line)}
                  </text>
                  """
              )

          svg = f"""
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="1080"
            height="1920"
            viewBox="0 0 1080 1920">

            <defs>

              <linearGradient
                id="bg"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                  offset="0%"
                  stop-color="#050B18"/>

                <stop
                  offset="50%"
                  stop-color="#102D4F"/>

                <stop
                  offset="100%"
                  stop-color="#020409"/>

              </linearGradient>

              <radialGradient id="glowBlue">

                <stop
                  offset="0%"
                  stop-color="#168CFF"
                  stop-opacity="0.55"/>

                <stop
                  offset="100%"
                  stop-color="#168CFF"
                  stop-opacity="0"/>

              </radialGradient>

              <radialGradient id="glowPurple">

                <stop
                  offset="0%"
                  stop-color="#7B4DFF"
                  stop-opacity="0.40"/>

                <stop
                  offset="100%"
                  stop-color="#7B4DFF"
                  stop-opacity="0"/>

              </radialGradient>

            </defs>

            <rect
              width="1080"
              height="1920"
              fill="url(#bg)"/>

            <circle
              cx="150"
              cy="350"
              r="550"
              fill="url(#glowBlue)"/>

            <circle
              cx="950"
              cy="1500"
              r="650"
              fill="url(#glowPurple)"/>

            <g
              opacity="0.10"
              stroke="white"
              stroke-width="2">

              <path d="M0 200 H1080"/>
              <path d="M0 400 H1080"/>
              <path d="M0 600 H1080"/>
              <path d="M0 800 H1080"/>
              <path d="M0 1000 H1080"/>
              <path d="M0 1200 H1080"/>
              <path d="M0 1400 H1080"/>
              <path d="M0 1600 H1080"/>
              <path d="M0 1800 H1080"/>

              <path d="M180 0 V1920"/>
              <path d="M360 0 V1920"/>
              <path d="M540 0 V1920"/>
              <path d="M720 0 V1920"/>
              <path d="M900 0 V1920"/>

            </g>

            <circle
              cx="540"
              cy="500"
              r="135"
              fill="#07111F"
              stroke="#4DA3FF"
              stroke-width="6"/>

            <circle
              cx="540"
              cy="500"
              r="105"
              fill="none"
              stroke="#8BC7FF"
              stroke-width="2"
              opacity="0.7"/>

            <text
              x="540"
              y="515"
              text-anchor="middle"
              font-family="DejaVu Sans, Arial, sans-serif"
              font-size="58"
              font-weight="800"
              fill="white">
              AI
            </text>

            <text
              x="540"
              y="675"
              text-anchor="middle"
              font-family="DejaVu Sans, Arial, sans-serif"
              font-size="30"
              font-weight="700"
              letter-spacing="3"
              fill="#9CCAFF">
              FREE AI TOOL
            </text>

            {''.join(text_elements)}

          </svg>
          """

          with open("scene1.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          print("Scene SVG created.")
          PY

      - name: Render Scene Image
        run: |
          ffmpeg \
            -y \
            -i scene1.svg \
            -frames:v 1 \
            scene1.png

      - name: Create Video With Voice And Background Music
        run: |
          mkdir -p output

          VOICE_DURATION=$(cat voice_duration.txt)

          echo "Creating final video..."
          echo "Duration: $VOICE_DURATION seconds"

          ffmpeg \
            -y \
            -loop 1 \
            -i scene1.png \
            -i audio/voice.wav \
            -stream_loop -1 \
            -i audio/background-music.wav \
            -t "$VOICE_DURATION" \
            -filter_complex "
              [1:a]volume=1.0[voice];

              [2:a]volume=0.10[music];

              [music][voice]
              sidechaincompress=
              threshold=0.025:
              ratio=8:
              attack=20:
              release=350:
              makeup=1
              [musicduck];

              [voice][musicduck]
              amix=
              inputs=2:
              duration=first:
              dropout_transition=2
              [mixed];

              [mixed]
              loudnorm=
              I=-16:
              TP=-1.5:
              LRA=7
              [aout]
            " \
            -r 30 \
            -vf "scale=1080:1920,zoompan=z='min(zoom+0.0007,1.04)':d=120:s=1080x1920:fps=30,format=yuv420p" \
            -map 0:v:0 \
            -map "[aout]" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -shortest \
            output/scene1-final.mp4

      - name: Verify Output
        run: |
          echo "Final video:"
          ls -lh output/scene1-final.mp4

          echo ""
          echo "Background music:"
          ls -lh audio/background-music.wav

          echo ""
          echo "Video information:"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output/scene1-final.mp4

      - name: Upload Scene 1 Files
        uses: actions/upload-artifact@v4
        with:
          name: scene1-final-music-test
          path: |
            output/scene1-final.mp4
            audio/voice-original.wav
            audio/voice.wav
            audio/background-music.wav
            tts_text.txt
            voice_duration.txt
