name: Free Video Renderer

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Read Scene 1 JSON
        run: |
          echo "Reading scene1.json..."

          TEXT=$(jq -r '.onScreenText' scene1.json)
          DURATION=$(jq -r '.duration' scene1.json)

          echo "Original text:"
          echo "$TEXT"

          echo "Duration: $DURATION"

          echo "TEXT=$TEXT" >> "$GITHUB_ENV"
          echo "DURATION=$DURATION" >> "$GITHUB_ENV"

      - name: Create Wrapped Text
        run: |
          python3 - <<'PY'
          import json
          import textwrap

          with open("scene1.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          text = data["onScreenText"]

          lines = textwrap.wrap(
              text,
              width=32,
              break_long_words=False,
              break_on_hyphens=False
          )

          with open("output_text.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))

          print("Wrapped text:")
          print("\n".join(lines))
          PY

          echo "Text file created:"
          cat output_text.txt

      - name: Create Scene 1 Video
        run: |
          mkdir -p output

          ffmpeg \
            -f lavfi \
            -i color=c=black:s=1080x1920:r=30 \
            -t "$DURATION" \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:textfile=output_text.txt:fontcolor=white:fontsize=52:line_spacing=18:x=(w-text_w)/2:y=(h-text_h)/2:fix_bounds=true,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            output/scene1.mp4

      - name: Check Output
        run: |
          ls -lh output/scene1.mp4

          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output/scene1.mp4

      - name: Upload Scene 1
        uses: actions/upload-artifact@v4
        with:
          name: scene1
          path: output/scene1.mp4
