      - name: Prepare Hindi TTS model files
        run: |
          cp -f hindi-tts-model/model.pt tts-space/model.pt
          
          if [ -f hindi-tts-model/ref_audio.wav ]; then
            cp -f hindi-tts-model/ref_audio.wav tts-space/ref_audio.wav
          fi
          
          if [ -f hindi-tts-model/ref_text.txt ]; then
            cp -f hindi-tts-model/ref_text.txt tts-space/ref_text.txt
          fi
          
          cp -f hindi-tts-model/mel_basis.pt tts-space/mel_basis.pt
          
          mkdir -p tts-space/vocos
          cp -f hindi-tts-model/vocos/config.yaml tts-space/vocos/config.yaml
          cp -f hindi-tts-model/vocos/pytorch_model.bin tts-space/vocos/pytorch_model.bin

          echo "TTS files prepared:"
          find tts-space -maxdepth 2 -type f | sort

      - name: Generate Hindi voice
        run: |
          mkdir -p audio

          cd tts-space

          python3 - <<'PY'
          import soundfile as sf
          from infer_core import HindiTTS

          text = """
          अगर आपको एक ऐसा ए आई टूल मिल जाए जो बिना पैसे दिए आपका काम मिनट्स में कर दे,
          तो क्या आप उसे ट्राय करेंगे?
          """

          print("Loading Hindi TTS model on CPU...")

          tts = HindiTTS(device="cpu")

          print("Generating voice...")

          sr, wave = tts.synth(
              text,
              nfe_step=32,
              seed=0
          )

          sf.write(
              "../audio/voice-original.wav",
              wave,
              sr
          )

          print("Voice generated successfully.")
          print("Sample rate:", sr)
          print("Audio samples:", len(wave))
          PY
