name: Free Hindi TTS Test

on:
  workflow_dispatch:

jobs:
  tts-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git python3-pip

      - name: Upgrade pip
        run: |
          python3 -m pip install --upgrade pip setuptools wheel

      - name: Download Hindi TTS inference code
        run: |
          git clone --depth 1 \
            https://huggingface.co/spaces/5ivatej/hindi-tts-190M \
            tts-space

      - name: Install required Python packages
        run: |
          pip install \
            torch \
            torchaudio \
            soundfile \
            numpy \
            scipy \
            librosa \
            einops \
            jieba \
            pypinyin \
            omegaconf \
            transformers \
            safetensors \
            accelerate \
            ema-pytorch \
            torchdiffeq \
            vocos \
            f5-tts \
            huggingface_hub

      - name: Generate Hindi voice
        working-directory: tts-space
        run: |
          mkdir -p ../audio

          python3 - <<'PY'
          import soundfile as sf
          from infer_core import HindiTTS

          text = """
          अगर आपको एक ऐसा ए आई टूल मिल जाए जो बिना पैसे दिए आपका काम मिनट्स में कर दे,
          तो क्या आप उसे ट्राय करेंगे?
          """

          print("Loading Hindi TTS model...")

          tts = HindiTTS(device="cpu")

          print("Generating Hindi voice...")

          sr, wave = tts.synth(
              text,
              nfe_step=32,
              seed=0
          )

          sf.write(
              "../audio/voice-original.wav",
              wave,
              sr
          )

          print("Voice generated successfully.")
          print("Sample rate:", sr)
          print("Audio samples:", len(wave))
          PY

      - name: Enhance voice
        run: |
          ffmpeg -y \
            -i audio/voice-original.wav \
            -af "highpass=f=70,equalizer=f=250:t=q:w=1:g=-1.5,equalizer=f=3000:t=q:w=1:g=1.5,acompressor=threshold=-18dB:ratio=2:attack=15:release=120:makeup=1.2,loudnorm=I=-16:TP=-1.5:LRA=7" \
            -ar 24000 \
            audio/voice-enhanced.wav

      - name: Check audio
        run: |
          echo "Original voice:"
          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            audio/voice-original.wav

          echo "Enhanced voice:"
          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            audio/voice-enhanced.wav

          ls -lh audio/

      - name: Upload voice files
        uses: actions/upload-artifact@v4
        with:
          name: hindi-tts-test
          path: |
            audio/voice-original.wav
            audio/voice-enhanced.wav
          if-no-files-found: error
